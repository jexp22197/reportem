<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPORT EM+</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2937">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REPORT EM+">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--green:#1e9b1e;--ui:#1f2937}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Open Sans","Noto Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#d9dde2;color:#000}
#app{position:relative;background:#d9dde2;min-height:100vh;padding-bottom:40px}

/* ---------- barra superior ---------- */
#top{position:sticky;top:0;z-index:50;background:var(--ui);color:#fff;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
#top .r{display:flex;gap:6px;align-items:center;overflow-x:auto;white-space:nowrap}
#top .brand{font-weight:700;letter-spacing:.5px;margin-right:8px}
#top .brand i{color:#5fe05f;font-style:normal}
.tab{flex:1;max-width:260px;border:0;background:#374151;color:#fff;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--green)}
.btn{border:0;background:#374151;color:#fff;padding:8px 11px;border-radius:8px;font-size:13px;cursor:pointer;flex:none}
.btn:hover{background:#4b5563}
.btn.g{background:#1e9b1e}.btn.g:hover{background:#188318}
.sep{width:1px;height:22px;background:#4b5563;margin:0 4px;flex:none}

/* ---------- sección de ingreso ---------- */
.view{max-width:800px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.card h2{margin:0 0 4px;font-size:16px}
.card .hint{margin:0 0 12px;font-size:12px;color:#64748b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w2{grid-column:1 / -1}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.fl{display:flex;flex-direction:column;gap:3px;min-width:0}
.fl>label{font-size:12px;color:#475569;font-weight:600}
.iw{position:relative;display:flex}
.iw input,.iw textarea{flex:1;width:100%;padding:9px 32px 9px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;font-size:14px;background:#fff;resize:none}
.iw input:focus,.iw textarea:focus{outline:2px solid #86d986;border-color:var(--green)}
.iw .x{position:absolute;right:6px;top:6px;width:22px;height:22px;border:0;border-radius:50%;background:#e2e8f0;color:#475569;font-size:11px;cursor:pointer;line-height:22px;padding:0}
.iw .x:hover{background:#fecaca;color:#b91c1c}
.b{padding:8px 12px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.b:hover{background:#eef2f6}
.b.s{padding:5px 9px;font-size:12px}
.b.g{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.b.r{color:#b91c1c;border-color:#fca5a5;background:#fff5f5}
.row-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.logoBox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logoBox img{height:56px;width:auto;border:1px solid #e2e8f0;border-radius:6px;padding:4px;background:#fff}

.bk{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin:4px 0;background:#fafbfc}
.bk .hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.bk .hd b{flex:1;font-size:13px}
.bk select{padding:5px 6px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;background:#fff}
.im{display:flex;gap:10px}
.im>img{width:96px;height:96px;object-fit:cover;border-radius:8px;flex:none;background:#eee}
.im .f{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.im label.ck{font-size:12px;color:#475569;display:flex;gap:6px;align-items:center}
.ins{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:3px 0;font-size:11px;color:#94a3b8}
.ins.big{padding:12px 0 2px}
.ins.big .b{padding:10px 14px;font-size:14px}
.ins.big .b.g{box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ---------- sección de informe final ---------- */
#vOut .zb{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 8px 0}
#vOut .zb span{font-size:13px;color:#334155;margin:0 6px}
#pages{--z:1;padding:12px 8px;display:flex;flex-direction:column;gap:14px;overflow-x:auto}
.pagewrap{width:calc(816px*var(--z));height:calc(1056px*var(--z));position:relative;flex:none;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.3);background:#fff}
.pagewrap .page{position:absolute;left:0;top:0;transform:scale(var(--z));transform-origin:0 0}
.page{position:relative;width:816px;height:1056px;background:#fff;overflow:hidden;color:#000}

.page .logo{display:block}
.hdr{position:absolute;left:76px;right:76px;top:52px;min-height:86px;border-bottom:1.5px solid #000;display:flex;gap:14px;font-size:10.5px;letter-spacing:.3px;line-height:1.3;padding-bottom:6px}
.hdr .logo{width:112px;height:auto;align-self:flex-start;flex:none}
.hdr .c1{width:178px;flex:none;--lw:62px}
.hdr .c2{flex:1;min-width:0;--lw:110px}
.kv{display:flex;gap:3px}
.kv b{font-weight:400;flex:none;width:var(--lw)}
.kv>span,.kv>div{min-width:0;word-break:break-word}
.kv.cnt b{width:auto}
.pbody{position:absolute;left:76px;right:76px;top:158px;height:800px}
.ftr{position:absolute;left:76px;right:76px;top:974px;padding-top:9px;display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.5px;line-height:1.35}
.ftr.ln{border-top:1.5px solid #000}
.ftr .fr{text-align:right}

.cover .logo{position:absolute;left:76px;top:56px;width:130px;height:auto}
.cbody{position:absolute;left:76px;top:372px;width:610px}
.cbody .ttl{font-size:34px;font-weight:300;letter-spacing:1px;line-height:1.25;text-transform:uppercase;word-break:break-word;white-space:pre-wrap}
.cbody .sub{font-size:24px;font-weight:300;letter-spacing:.4px;text-transform:uppercase;margin-top:14px;line-height:1.25;white-space:pre-wrap}
.cbody .rule{width:455px;height:2.5px;background:#000;margin:22px 0 12px}
.cbody .meta{font-size:12.5px;line-height:1.4;--lw:70px;letter-spacing:.2px}
.cbody .meta+.rule{margin:14px 0 0}

.row{margin-bottom:14px}
.txt{font-size:12.5px;line-height:1.32;text-align:justify;white-space:pre-wrap;word-break:break-word;min-height:1.32em}
.t-h1 .txt{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;text-align:left}
.t-h2 .txt{font-size:13.5px;font-weight:700;text-align:left}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.imgs.one{grid-template-columns:1fr}
.icell{display:flex;gap:6px;font-size:12px;line-height:1.3;min-width:0}
.num{font-size:9.5px;width:22px;flex:none;padding-top:68px}
.big .num{padding-top:160px}
.ib{flex:1;min-width:0}
.box{height:150px;display:flex;align-items:center}
.box img{display:block;max-width:100%;max-height:150px;width:auto;height:auto}
.big .box{height:340px}.big .box img{max-height:340px}
.fname{font-size:9.5px;letter-spacing:.3px;margin:5px 0 8px 12px;min-height:1.3em;word-break:break-all}
.idate{min-height:1.3em}
.cap{min-height:1.3em;white-space:pre-wrap;word-break:break-word}
#mh{position:absolute;left:-99999px;top:0;width:664px;visibility:hidden}

/* superposiciones */
#busy{position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:200;display:none;align-items:center;justify-content:center;color:#fff;font-size:16px;text-align:center;padding:20px}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:210;display:none;align-items:center;justify-content:center;padding:16px}
#modal .mbx{background:#fff;border-radius:14px;padding:20px;max-width:420px;width:100%}
#modal h3{margin:0 0 8px}
#modal p{margin:0 0 14px;font-size:14px;color:#374151;line-height:1.4}
#modal .mb{display:flex;flex-direction:column;gap:8px}
#modal button{padding:12px;border-radius:10px;border:1px solid #cbd5e1;background:#f1f5f9;font-size:15px;cursor:pointer}
#modal button.ok{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:220;display:none;max-width:90vw;text-align:center}

#exportHost{position:absolute;left:0;top:0;width:816px;z-index:-1}
#exportHost .page{margin:0}

@page{size:letter;margin:0}
@media print{
  body.printing{background:#fff}
  body.printing #app,body.printing #busy,body.printing #modal,body.printing #toast{display:none!important}
  body.printing #exportHost{position:static;z-index:auto}
  body.printing #exportHost .page{break-after:page;page-break-after:always}
  body.printing #exportHost .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="r">
      <span class="brand">REPORT <i>EM+</i></span>
      <button class="tab on" id="tIn">✏️ Ingreso de datos</button>
      <button class="tab" id="tOut">📄 Informe final</button>
    </div>
    <div class="r">
      <button class="btn" id="bPrint">🖨 Imprimir</button>
      <button class="btn" id="bPdf">⬇ PDF</button>
      <button class="btn" id="bJpg">🖼 JPG</button>
      <button class="btn g" id="bWa">WhatsApp</button>
      <span class="sep"></span>
      <button class="btn" id="bNew">📄 Nuevo</button>
      <button class="btn" id="bOpen">📂 Abrir</button>
      <button class="btn" id="bSaveP">💾 Proyecto</button>
    </div>
  </div>

  <!-- ===== SECCIÓN 1: INGRESO ===== -->
  <div id="vIn" class="view">
    <div class="card">
      <h2>Portada y datos del informe</h2>
      <p class="hint">Estos datos aparecen en la portada, el encabezado y el pie de cada página. Use la ✕ de cada campo para limpiarlo.</p>
      <div class="grid" id="formGrid"></div>
      <div class="logoBox" style="margin-top:12px">
        <img id="logoPrev" alt="logo">
        <button class="b" id="bLogo">Cambiar logo</button>
        <button class="b" id="bLogoRes">Usar logo original</button>
      </div>
      <div class="row-b">
        <button class="b r" id="bClrF">🧹 Limpiar campos del informe</button>
        <button class="b r" id="bClrAll">🧹 Limpiar todos (incluye empresa y contacto)</button>
      </div>
    </div>

    <div class="card">
      <h2>Contenido del informe</h2>
      <p class="hint">Agregue texto y fotos en el orden que quiera, en cualquier parte. <span id="cnt"></span></p>
      <div id="list"></div>
      <div class="row-b"><button class="b r" id="bClrC">🗑 Vaciar todo el contenido</button></div>
    </div>
    <div style="text-align:center"><button class="b g" id="bGoOut" style="padding:12px 22px;font-size:15px">Ver informe final →</button></div>
  </div>

  <!-- ===== SECCIÓN 2: INFORME FINAL ===== -->
  <div id="vOut" style="display:none">
    <div class="zb">
      <button class="btn" id="zOut" style="background:#475569">−</button>
      <button class="btn" id="zFit" style="background:#475569">Ajustar</button>
      <button class="btn" id="zIn" style="background:#475569">+</button>
      <span id="pgInfo"></span>
    </div>
    <div id="pages"></div>
  </div>
</div>

<div id="mh"></div>
<div id="exportHost"></div>
<div id="busy"><div id="busyTxt"></div></div>
<div id="modal"><div class="mbx"><h3></h3><p></p><div class="mb"></div></div></div>
<div id="toast"></div>

<input type="file" id="fGal" accept="image/*" multiple hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fLogo" accept="image/*" hidden>
<input type="file" id="fProj" accept=".json,application/json" hidden>

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('reportem',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbSet(v){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,'doc')}catch(e){}}
async function dbGet(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get('doc');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}

function mkClear(inp,onClear){
  const x=el('button','x','✕');x.type='button';x.title='Limpiar';
  x.onclick=()=>{inp.value='';onClear();if(inp.tagName==='TEXTAREA')grow(inp);save();inp.focus()};
  return x;
}
function renderForm(){
  const g=$('#formGrid');g.textContent='';
  FIELDS.forEach(([k,label,type,wide])=>{
    const fl=el('div','fl'+(wide?' w2':''));fl.appendChild(el('label',null,label));
    const iw=el('div','iw');
    const inp=document.createElement(type==='area'?'textarea':'input');
    if(type==='area')inp.rows=2;else inp.type=k==='email'?'email':'text';
    inp.value=S.fields[k]||'';
    inp.addEventListener('input',()=>{S.fields[k]=inp.value;if(type==='area')grow(inp);save()});
    iw.append(inp,mkClear(inp,()=>{S.fields[k]=''}));fl.appendChild(iw);
    if(k==='creado'){const nb=el('button','b s','Poner fecha y hora actual');nb.type='button';nb.style.alignSelf='flex-start';nb.onclick=()=>{S.fields.creado=fmtDate();inp.value=S.fields.creado;save()};fl.appendChild(nb)}
    g.appendChild(fl);
  });
  g.querySelectorAll('textarea').forEach(t=>requestAnimationFrame(()=>grow(t)));
  $('#logoPrev').src=S.logo||DEFAULT_LOGO;
}
const sbtn=(t,fn,c)=>{const b=el('button','b s'+(c?' '+c:''),t);b.type='button';b.onclick=fn;return b};

function insBar(idx,big){
  const d=el('div','ins'+(big?' big':''));
  if(!big)d.appendChild(el('span',null,'Insertar aquí:'));
  const mk=(t,fn,c)=>{const b=el('button','b'+(big?'':' s')+(c?' '+c:''),t);b.type='button';b.onclick=fn;return b};
  d.append(mk('＋ Texto',()=>addText(idx),big?'g':''),mk('🖼 Galería',()=>pick('fGal',idx),big?'g':''),mk('📷 Cámara',()=>pick('fCam',idx),big?'g':''),mk('⏎ Salto de página',()=>addBreak(idx)));
  return d;
}
function blockCard(b,i,n){
  const c=el('div','bk');c.dataset.bid=b.id;
  const hd=el('div','hd');
  hd.appendChild(el('b',null,b.type==='text'?'Texto':b.type==='image'?'Foto ('+n+')':'⏎ Salto de página'));
  if(b.type==='text'){
    const s=document.createElement('select');
    [['p','Párrafo'],['h1','Título'],['h2','Subtítulo']].forEach(([v,t])=>{const o=el('option',null,t);o.value=v;s.appendChild(o)});
    s.value=b.style||'p';s.onchange=()=>{b.style=s.value;save()};hd.appendChild(s);
  }
  hd.append(sbtn('↑',()=>move(i,-1)),sbtn('↓',()=>move(i,1)),sbtn('🗑',()=>del(i),'r'));
  c.appendChild(hd);
  if(b.type==='text'){
    const iw=el('div','iw');const ta=document.createElement('textarea');ta.rows=4;ta.placeholder='Escriba aquí el texto del informe…';ta.value=b.text||'';
    ta.addEventListener('input',()=>{b.text=ta.value;grow(ta);save()});
    iw.append(ta,mkClear(ta,()=>{b.text=''}));c.appendChild(iw);
    requestAnimationFrame(()=>grow(ta));
  }else if(b.type==='image'){
    const im=el('div','im');const img=document.createElement('img');img.src=b.src;im.appendChild(img);
    const f=el('div','f');
    const field=(ph,prop,area)=>{
      const iw=el('div','iw');const inp=document.createElement(area?'textarea':'input');if(area)inp.rows=2;
      inp.placeholder=ph;inp.value=b[prop]||'';
      inp.addEventListener('input',()=>{b[prop]=inp.value;if(area)grow(inp);save()});
      iw.append(inp,mkClear(inp,()=>{b[prop]=''}));
      if(area)requestAnimationFrame(()=>grow(inp));return iw;
    };
    f.append(field('Nombre del archivo (ej. 415.jpeg)','name'),field('Fecha de la imagen','date'),field('Descripción de la imagen','caption',true));
    const lb=el('label','ck');const ck=document.createElement('input');ck.type='checkbox';ck.checked=!!b.big;
    ck.onchange=()=>{b.big=ck.checked;save()};lb.append(ck,'Mostrar en ancho completo (más grande)');f.appendChild(lb);
    im.appendChild(f);c.appendChild(im);
  }
  return c;
}
function renderList(){
  const L=$('#list');L.textContent='';let n=0;
  if(S.blocks.length)L.appendChild(insBar(0,false));
  S.blocks.forEach((b,i)=>{
    if(b.type==='image')n++;
    L.appendChild(blockCard(b,i,n));
    if(i<S.blocks.length-1)L.appendChild(insBar(i+1,false));
  });
  L.appendChild(insBar(S.blocks.length,true));
  $('#cnt').textContent=`(${S.blocks.length} bloque(s), ${n} imagen(es))`;
}
function revealBlock(id,focus){
  requestAnimationFrame(()=>{
    const c=document.querySelector('.bk[data-bid="'+id+'"]');if(!c)return;
    c.scrollIntoView({block:'center',behavior:'smooth'});
    if(focus){const t=c.querySelector('textarea');if(t)t.focus()}
  });
}
function insertAt(idx,arr){
  const i=idx==null?S.blocks.length:Math.max(0,Math.min(idx,S.blocks.length));
  S.blocks.splice(i,0,...arr);renderList();save();revealBlock(arr[0].id,arr[0].type==='text');
}
function addText(idx){insertAt(idx,[{id:uid(),type:'text',style:'p',text:''}])}
function addBreak(idx){insertAt(idx,[{id:uid(),type:'break'}])}
function pick(inputId,idx){pendIdx=idx;$('#'+inputId).click()}
function move(i,d){
  const j=i+d;if(j<0||j>=S.blocks.length)return;
  const id=S.blocks[i].id;[S.blocks[i],S.blocks[j]]=[S.blocks[j],S.blocks[i]];renderList();save();revealBlock(id,false);
}
function del(i){
  const b=S.blocks[i];
  if((b.type==='image'||(b.type==='text'&&(b.text||'').trim()))&&!confirm('¿Eliminar este bloque?'))return;
  S.blocks.splice(i,1);renderList();save();
}

/* imágenes */
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function toDataURL(file,max,type,q){
  const im=await loadImage(file);let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
  x.drawImage(im,0,0,w,h);return c.toDataURL(type,q);
}
async function fileToBlock(f){
  const src=await toDataURL(f,1600,'image/jpeg',.85);
  const gen=!f.name||/^image\.(jpe?g|png|heic)$/i.test(f.name);
  const name=gen?String(Date.now()%1000000)+'.jpeg':f.name;
  return{id:uid(),type:'image',src,name,date:fmtDate(f.lastModified?new Date(f.lastModified):new Date()),caption:'',big:false};
}
async function addFiles(files){
  if(!files.length)return;busy('Procesando imágenes…');const arr=[];
  for(const f of files){try{arr.push(await fileToBlock(f))}catch(_){toast('No se pudo leer '+f.name)}}
  busy();if(arr.length)insertAt(pendIdx,arr);pendIdx=null;
}

function buildRows(){
  const rows=[];let cur=null,n=0;
  for(const b of S.blocks){
    if(b.type==='image'){
      n++;const it={b,n};
      if(b.big){rows.push({k:'img',items:[it],big:true});cur=null}
      else if(cur&&cur.items.length<2)cur.items.push(it);
      else{cur={k:'img',items:[it]};rows.push(cur)}
    }else{
      cur=null;
      rows.push(b.type==='break'?{k:'brk'}:{k:'txt',b,text:b.text||''});
    }
  }
  return{rows,count:n};
}

}
const mh=$('#mh');
function measureH(node){mh.appendChild(node);const h=node.offsetHeight+GAP;mh.removeChild(node);return h}
function paginate(rows){
  const pages=[[]];let used=0;
  const np=()=>{pages.push([]);used=0};
  const cur=()=>pages[pages.length-1];
  for(const r of rows){
    if(r.k==='brk'){np();continue}
    const h=measureH(rowEl(r));
    if(r.k==='img'){if(used+h>BODY_H&&used>0)np();cur().push(r);used+=h;continue}
    if(used+h<=BODY_H){cur().push(r);used+=h;continue}
    if(BODY_H-used<70)np();
    let t=r.text;
    const probe=s=>measureH(rowEl({k:'txt',b:r.b,text:s}));
    while(true){
      const h2=probe(t);
      if(used+h2<=BODY_H){cur().push({k:'txt',b:r.b,text:t});used+=h2;break}
      const ends=[];const re=/\S+\s*/g;let m;while((m=re.exec(t)))ends.push(m.index+m[0].length);
      let lo=0,hi=ends.length-1,best=-1;
      while(lo<=hi){const mid=(lo+hi)>>1;if(used+probe(t.slice(0,ends[mid]))<=BODY_H){best=mid;lo=mid+1}else hi=mid-1}
      if(best<0){if(used>0){np();continue}best=0}
      const k=ends.length?ends[best]:t.length;
      cur().push({k:'txt',b:r.b,text:t.slice(0,k)});
      t=t.slice(k);np();
      if(!t.length)break;
    }
  }
  return pages;
}
function buildPages(){
  const{rows,count}=buildRows();
  const pgs=paginate(rows);
  const total=1+pgs.length;
  const out=[coverPage(total)];
  pgs.forEach((rs,i)=>{
    const p=el('div','page');p.appendChild(header(count));
    const b=el('div','pbody');rs.forEach(r=>b.appendChild(rowEl(r)));
    p.append(b,footer(i+2,total,true));out.push(p);
  });
  return out;
}
function Z(){return zoom==='fit'?Math.min(1.1,(document.documentElement.clientWidth-16)/816):zoom}
function applyZoom(){$('#pages').style.setProperty('--z',Z())}
function renderPreview(){
  const host=$('#pages');host.textContent='';
  const pgs=buildPages();
  pgs.forEach(p=>{const w=el('div','pagewrap');w.appendChild(p);host.appendChild(w)});
  $('#pgInfo').textContent=pgs.length+' página(s) · tamaño carta';
  applyZoom();
}
$('#zIn').onclick=()=>{zoom=Math.min(2,+(Z()+.15).toFixed(2));applyZoom()};
$('#zOut').onclick=()=>{zoom=Math.max(.3,+(Z()-.15).toFixed(2));applyZoom()};
$('#zFit').onclick=()=>{zoom='fit';applyZoom()};
window.addEventListener('resize',()=>{if(zoom==='fit'&&view==='out')applyZoom()});

/* pestañas */
function show(v){
  view=v;
  $('#vIn').style.display=v==='in'?'':'none';
  $('#vOut').style.display=v==='out'?'':'none';
  $('#tIn').classList.toggle('on',v==='in');$('#tOut').classList.toggle('on',v==='out');
  if(v==='out'){renderPreview()}
  window.scrollTo(0,0);
}
$('#tIn').onclick=()=>show('in');
$('#tOut').onclick=()=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();show('out')};
$('#bGoOut').onclick=()=>show('out');

   ===================================================== */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('lib'));document.head.appendChild(s)})}
async function libs(){
  if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}
async function capture(){
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  busy('Preparando…');await libs();
  const host=$('#exportHost');const pgs=buildPages();window.scrollTo(0,0);const out=[];
  for(let i=0;i<pgs.length;i++){
    busy(`Generando página ${i+1} de ${pgs.length}…`);
    host.textContent='';host.appendChild(pgs[i]);
    await new Promise(r=>setTimeout(r,80));
    out.push(await html2canvas(pgs[i],{scale:1.75,backgroundColor:'#ffffff',useCORS:true,logging:false,scrollX:0,scrollY:0}));
  }
  host.textContent='';return out;
}
const shareText=()=>'Informe EM+ — '+(S.fields.titcorto||S.fields.titulo||'');
const canShareFiles=f=>navigator.canShare&&navigator.share&&navigator.canShare({files:f});
const isTouch=()=>'ontouchstart' in window;
function exportFail(e){busy();console.error(e);modal('No se pudo generar','Para PDF/JPG se necesita conexión a internet la primera vez (se descarga la librería de exportación). Alternativa sin internet: use "Imprimir" y elija "Guardar como PDF".',[['Cerrar',closeModal]])}

async function exportPDF(mode){
  try{
    const cs=await capture();busy('Armando PDF…');
    const{jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'letter',orientation:'portrait',compress:true});
    cs.forEach((c,i)=>{if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,612,792,undefined,'FAST')});
    const blob=pdf.output('blob');busy();
    const name=baseName()+'.pdf';const file=new File([blob],name,{type:'application/pdf'});
    const btns=[];
    if(canShareFiles([file]))btns.push([mode==='wa'?'📲 Enviar por WhatsApp':'📲 Compartir',()=>navigator.share({files:[file],title:name,text:shareText()}).catch(()=>{}),'ok']);
    else if(mode==='wa')btns.push(['📲 Abrir WhatsApp',()=>{dl(blob,name);window.open('https://wa.me/?text='+encodeURIComponent(shareText()),'_blank')},'ok']);
    btns.push(['⬇ Descargar PDF',()=>dl(blob,name),mode==='save'?'ok':'']);btns.push(['Cerrar',closeModal]);
    modal('PDF listo',`${cs.length} página(s). `+(mode==='wa'&&!canShareFiles([file])?'Se descargará el PDF y se abrirá WhatsApp: adjúntelo con el clip.':'Elija una opción.'),btns);
    if(mode==='save'&&!isTouch())dl(blob,name);
  }catch(e){exportFail(e)}
}
async function exportJPG(){
  try{
    const cs=await capture();busy('Armando imágenes…');
    const blobs=await Promise.all(cs.map(c=>new Promise(r=>c.toBlob(r,'image/jpeg',.92))));busy();
    const files=blobs.map((b,i)=>new File([b],`${baseName()} - pag ${i+1}.jpg`,{type:'image/jpeg'}));
    const btns=[];
    if(canShareFiles(files))btns.push(['📲 Compartir / guardar en galería',()=>navigator.share({files,title:baseName()}).catch(()=>{}),'ok']);
    btns.push(['⬇ Descargar JPG ('+files.length+')',async()=>{for(const f of files){dl(f,f.name);await new Promise(r=>setTimeout(r,500))}},canShareFiles(files)?'':'ok']);
    btns.push(['Cerrar',closeModal]);
    modal('JPG listo',`${files.length} imagen(es), una por página.`,btns);
  }catch(e){exportFail(e)}
}
$('#bPdf').onclick=()=>exportPDF('save');
$('#bWa').onclick=()=>exportPDF('wa');
$('#bJpg').onclick=exportJPG;
$('#bPrint').onclick=()=>{
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  setTimeout(()=>{
    const host=$('#exportHost');host.textContent='';buildPages().forEach(p=>host.appendChild(p));
    document.body.classList.add('printing');window.print();
  },250);
};
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');$('#exportHost').textContent=''});
